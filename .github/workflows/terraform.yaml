name: 🌐 Validation

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk
    paths:
      #This should only run when terraform files have been changed.
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.json'
      - '**/*.yaml'
      - '**/*.tftest.hcl'
  workflow_dispatch:
  release:
    types: [created]
  issue_comment:
      types: [created]  

permissions:
  id-token: write
  contents: read
  pull-requests: write  # Needed for comment reactions

env:
  TF_VAR_subscription_id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
  TF_VAR_tenant_id: ${{ secrets.AZ_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}

concurrency: 
  group: terraform-plan-apply-destroy
  cancel-in-progress: false

jobs:
  # Terraform Validate does not support runs inside configurations that are intended to be called as a module with configuration_aliases on providers.
  # This is a known issue: https://discuss.hashicorp.com/t/validating-modules-which-have-configuration-aliases/46056/15
  #validate:
  #  if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/trunk')
  #  runs-on: ubuntu-latest
  #  name: 🔍 Terraform Validate
  #  steps:
  #      - name: Checkout
  #        uses: actions/checkout@v4
  #  
  #      - name: Set up Terraform
  #        uses: hashicorp/setup-terraform@v3
  #        with:
  #          terraform_version: "~1.10.0" 
  #  
  #      - name: terraform init station module
  #        run: terraform init
  #  
  #      - name: terraform validate station
  #        run: terraform validate
  
  # Check if this is a comment trigger for full test run
  check_comment:
    name: 🔍 Check for test trigger comment
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    outputs:
      run_full_tests: ${{ steps.check.outputs.run_full_tests }}
    steps:
      - name: Check comment for test trigger
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const comment = context.payload.comment.body.toLowerCase().trim();
            const isFullTestTrigger = comment === '/test-all' || comment === '/test all';
            
            if (isFullTestTrigger) {
              // React to the comment to acknowledge
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
              
              core.setOutput('run_full_tests', 'true');
              core.info('Full test run triggered by comment');
            } else {
              core.setOutput('run_full_tests', 'false');
              core.info('Comment does not trigger tests');
            }
  
  list_test_files:
    name: 🔍 Determine tests to run
    # Run for all events except issue_comment, or when issue_comment triggers full tests
    if: |
      always() && 
      (needs.check_comment.result == 'skipped' || needs.check_comment.outputs.run_full_tests == 'true')
    needs: [check_comment]
    runs-on: ubuntu-latest
    outputs:
      test_files: ${{ steps.set-matrix.outputs.test_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for accurate diff
      
      - name: Fetch base branch for PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
      
      - name: Checkout PR HEAD for comment trigger
        if: github.event_name == 'issue_comment'
        run: |
          gh pr checkout ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Fetch base branch for comment trigger
        if: github.event_name == 'issue_comment'
        run: |
          BASE_REF=$(gh pr view ${{ github.event.issue.number }} --json baseRefName --jq '.baseRefName')
          git fetch origin "$BASE_REF" --depth=1
        env:
          GH_TOKEN: ${{ github.token }}

      - id: set-matrix
        run: |
          # Check if we should run all tests (manual trigger or release)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || \
             [[ "${{ github.event_name }}" == "release" ]] || \
             [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "Manual trigger or release detected - running all tests"
            files=$(find tests -name '*.tftest.hcl' | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            # Use the script to determine which tests to run
            chmod +x .github/scripts/determine-tests.sh
            test_output=$(.github/scripts/determine-tests.sh)
            echo "$test_output"
            # Extract just the JSON array from the last line
            files=$(echo "$test_output" | tail -n 1)
          fi
          
          echo "Test files to run: $files"
          printf 'test_files=%s\n' "$files" >> "$GITHUB_OUTPUT"
          
  terraform_test:
    environment: E2E_testing
    needs: ["list_test_files"]
    runs-on: ubuntu-latest
    name: 🥼 Terraform tests
    strategy:
      matrix:
        test_file: ${{ fromJson(needs.list_test_files.outputs.test_files) }}
      max-parallel: 10
    continue-on-error: true # Ensures that the other tests continue even if one fails.

    env:
        TFE_ORGANIZATION: ${{ secrets.TFE_ORGANIZATION }}
        TF_VAR_tfc_organization_name: ${{ secrets.TF_VAR_TFC_ORGANIZATION_NAME }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
    steps:
        - name: 'Azure: login'
          uses: azure/login@v2
          with:
            client-id:       ${{ secrets.AZ_CLIENT_ID }}
            subscription-id: ${{ secrets.AZ_SUBSCRIPTION_ID }}
            tenant-id:       ${{ secrets.AZ_TENANT_ID }}
    
        - name: Checkout
          uses: actions/checkout@v4
        
        - name: Append Run ID to Project Name
          run: echo "TF_VAR_tfc_project_name=${{ secrets.TF_VAR_TFC_PROJECT_NAME }}-${{ github.run_id }}-tests" >> $GITHUB_ENV
        
        - name: Set up Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: "~1.12.0"
            cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
        
        - name: Terraform init
          run: terraform init
          
        - name: Run test file ${{ matrix.test_file }}
          run: terraform test -filter=${{ matrix.test_file }}
